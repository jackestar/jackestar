name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (runs on the default branch only)
  workflow_dispatch:
  push:
    # lets you test from `develop`; README-only commits won't retrigger this
    paths:
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate blocks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # EXCLUDE_LANGS: "HTML,CSS,Roff"
        run: python scripts/update_profile.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore(profile): update stats [skip ci]"
            git push
          fi